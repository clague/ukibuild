name: Publish to AUR

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aur-publish
  cancel-in-progress: false

jobs:
  aur:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux:latest
      options: --user root
    env:
      AUR_PACKAGE: ${{ vars.AUR_PACKAGE || 'ukibuild' }}

    steps:
      # actions/checkout needs git before the workspace exists.
      - name: Bootstrap container
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm --needed \
            base-devel git openssh pacman-contrib sudo curl

      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build user
        run: |
          set -euo pipefail
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' >/etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Update PKGBUILD metadata
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd packaging/aur

          pkgver="${REF_NAME#v}"
          if [[ ! $pkgver =~ ^[0-9] ]]; then
            pkgver=$(sed -n 's/^pkgver=//p' PKGBUILD)
          fi
          pkgver="${pkgver//-/_}"
          [[ $pkgver =~ ^[0-9][A-Za-z0-9._+]*$ ]] \
            || { echo "::error::invalid pkgver: $pkgver"; exit 1; }

          script_version=$(sed -n 's/^readonly VERSION="\(.*\)"/\1/p' ../../ukibuild)
          if [[ $script_version != "$pkgver" ]]; then
            echo "::error::tag/pkgver $pkgver does not match ukibuild VERSION $script_version"
            exit 1
          fi

          sed -i "s/^pkgver=.*/pkgver=${pkgver}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i "s/^_owner=.*/_owner=\"${REPO_OWNER}\"/" PKGBUILD
          sed -i "s/^_repo=.*/_repo=\"${REPO_NAME}\"/" PKGBUILD

          echo "PKGVER=${pkgver}" >> "$GITHUB_ENV"
          grep -E '^(pkgver|pkgrel|_owner|_repo)=' PKGBUILD

      - name: Build package and generate .SRCINFO
        run: |
          set -euo pipefail
          cd packaging/aur
          sudo -u builder updpkgsums
          sudo -u builder makepkg --printsrcinfo > .SRCINFO
          sudo -u builder makepkg -s -f --noconfirm

      - name: Push to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          AUR_PACKAGE="${AUR_PACKAGE:-ukibuild}"
          AUR_PACKAGE="${AUR_PACKAGE//[[:space:]]/}"
          if [[ -z $AUR_PACKAGE ]]; then
            echo "::error::AUR_PACKAGE is empty"
            exit 1
          fi
          echo "::notice::AUR package: $AUR_PACKAGE"

          if [[ -z ${AUR_SSH_PRIVATE_KEY:-} ]]; then
            echo "::error::AUR_SSH_PRIVATE_KEY is not set"
            exit 1
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" >~/.ssh/aur
          chmod 600 ~/.ssh/aur

          if ! grep -q 'BEGIN .*PRIVATE KEY' ~/.ssh/aur; then
            echo "::error::AUR_SSH_PRIVATE_KEY does not contain a private key"
            exit 1
          fi
          if ! ssh-keygen -y -P '' -f ~/.ssh/aur >/tmp/aur.pub 2>/dev/null; then
            echo "::error::AUR_SSH_PRIVATE_KEY is invalid or passphrase-protected; use an unencrypted private key"
            exit 1
          fi
          key_fp=$(ssh-keygen -lf /tmp/aur.pub | awk '{print $2}')
          echo "::notice::AUR SSH key fingerprint: $key_fp"

          if ! ssh-keyscan aur.archlinux.org >>~/.ssh/known_hosts 2>/dev/null; then
            echo "::error::ssh-keyscan aur.archlinux.org failed"
            exit 1
          fi
          cat >~/.ssh/config <<'EOF'
          Host aur.archlinux.org
            User aur
            IdentityFile ~/.ssh/aur
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config

          git config --global user.name "AUR Publisher"
          git config --global user.email "aur@localhost"
          git config --global init.defaultBranch master

          rm -rf /tmp/aur
          # A new package is cloned as an empty repository; the first push
          # creates it. A failure here means SSH authentication is wrong.
          if ! clone_out=$(git -c init.defaultBranch=master clone \
                "ssh://aur@aur.archlinux.org/${AUR_PACKAGE}.git" /tmp/aur 2>&1); then
            printf '%s\n' "$clone_out"
            detail=$(printf '%s\n' "$clone_out" | tail -n 3 | tr '\n' ' ')
            echo "::error::AUR clone failed: $detail"
            exit 1
          fi

          install -m 644 packaging/aur/PKGBUILD /tmp/aur/PKGBUILD
          install -m 644 packaging/aur/.SRCINFO /tmp/aur/.SRCINFO
          install -m 644 packaging/aur/ukibuild.install /tmp/aur/ukibuild.install

          cd /tmp/aur
          git add PKGBUILD .SRCINFO ukibuild.install
          if git diff --cached --quiet; then
            echo "AUR package is already up to date."
            exit 0
          fi

          git commit -m "Update to ${PKGVER}"
          git push origin master
